name: Trigger auto deployment for common-service

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/common-service-AutoDeployTrigger-fef8d201-6832-4e9f-af24-eec3a18bdf6c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.COMMONSERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.COMMONSERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.COMMONSERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}Dockerfile
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: amitallservice.azurecr.io
          registryUsername: ${{ secrets.COMMONSERVICE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.COMMONSERVICE_REGISTRY_PASSWORD }}
          containerAppName: common-service
          resourceGroup: Amit_Common
          imageToBuild: amitallservice.azurecr.io/common-service:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


