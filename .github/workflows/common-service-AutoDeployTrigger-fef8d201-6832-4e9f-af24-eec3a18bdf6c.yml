name: Trigger auto deployment for common-service

on:
  push:
    branches: 
      [ main, master ]
    paths:
    - '**'

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Check Azure Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.COMMONSERVICE_AZURE_CLIENT_ID }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning::Azure secrets not configured in GitHub Secrets. Skipping Azure deployment."
          fi

      - name: Azure Login
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.COMMONSERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.COMMONSERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.COMMONSERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: amitallservice.azurecr.io
          registryUsername: ${{ secrets.COMMONSERVICE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.COMMONSERVICE_REGISTRY_PASSWORD }}
          containerAppName: common-service
          resourceGroup: Amit_Common
          imageToBuild: amitallservice.azurecr.io/common-service:${{ github.sha }}


