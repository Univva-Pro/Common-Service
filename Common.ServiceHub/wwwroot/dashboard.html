<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommonHub - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="glass-nav">
        <div class="logo">
            <span>CommonHub</span>
            <span id="userRoleBadge" class="badge">User</span>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <span id="userNameDisplay" style="color: var(--text-secondary); font-weight: 500;"></span>
            <button id="logoutBtn" class="btn-secondary btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="tab-nav">
            <button id="itemsTabBtn" class="tab-btn active" onclick="switchTab('items')">📦 Inventory Items</button>
            <button id="usersTabBtn" class="tab-btn" onclick="switchTab('users')">👥 User Management</button>
        </div>

        <!-- Items Section -->
        <div id="itemsSection">
            <div class="header-action">
                <h2>Item Inventory (Live 1-to-3 Sync)</h2>
                <button id="addItemBtn" class="submit-btn btn-sm hidden" onclick="openItemModal()">+ Add New
                    Item</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Source Service</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Users Section -->
        <div id="usersSection" class="hidden">
            <div class="header-action">
                <h2>User Management</h2>
                <button class="submit-btn btn-sm" onclick="openUserModal()">+ Add New User</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div id="itemModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem; font-family: var(--font-heading); font-size: 1.4rem;">Add Common Item</h3>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label class="input-label">Item Name</label>
                <input type="text" id="itemName" class="form-input" style="padding-left: 14px;"
                    placeholder="e.g. Printer Paper">
            </div>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label class="input-label">Category</label>
                <input type="text" id="itemCategory" class="form-input" style="padding-left: 14px;"
                    placeholder="e.g. Stationery">
            </div>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label class="input-label">Price ($)</label>
                <input type="number" id="itemPrice" class="form-input" style="padding-left: 14px;" placeholder="15.99">
            </div>
            <div class="input-group" style="margin-bottom: 1.5rem;">
                <label class="input-label">Stock Quantity</label>
                <input type="number" id="itemStock" class="form-input" style="padding-left: 14px;" placeholder="100">
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn-secondary" onclick="closeItemModal()">Cancel</button>
                <button class="submit-btn btn-sm" onclick="saveItem()">Save Item</button>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal (Admin Only) -->
    <div id="editItemModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem; font-family: var(--font-heading); font-size: 1.4rem;">Edit Common Item</h3>
            <input type="hidden" id="editItemId">
            <div class="input-group" style="margin-bottom: 1rem;">
                <label class="input-label">Item Name</label>
                <input type="text" id="editItemName" class="form-input" style="padding-left: 14px;"
                    placeholder="e.g. Printer Paper">
            </div>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label class="input-label">Category</label>
                <input type="text" id="editItemCategory" class="form-input" style="padding-left: 14px;"
                    placeholder="e.g. Stationery">
            </div>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label class="input-label">Price ($)</label>
                <input type="number" id="editItemPrice" class="form-input" style="padding-left: 14px;"
                    placeholder="15.99">
            </div>
            <div class="input-group" style="margin-bottom: 1.5rem;">
                <label class="input-label">Stock Quantity</label>
                <input type="number" id="editItemStock" class="form-input" style="padding-left: 14px;"
                    placeholder="100">
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn-secondary" onclick="closeEditItemModal()">Cancel</button>
                <button class="submit-btn btn-sm" onclick="updateItem()">Update Item</button>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="userModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem; font-family: var(--font-heading); font-size: 1.4rem;">Create User Account
            </h3>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label class="input-label">Username</label>
                <input type="text" id="newUsername" class="form-input" style="padding-left: 14px;"
                    placeholder="e.g. john_doe">
            </div>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label class="input-label">Password</label>
                <input type="password" id="newPassword" class="form-input" style="padding-left: 14px;"
                    placeholder="Enter password">
            </div>
            <div class="input-group" style="margin-bottom: 1.5rem;">
                <label class="input-label">Role</label>
                <select id="newRole" class="form-input" style="padding-left: 14px; background: rgba(15, 23, 42, 0.9);">
                    <option value="User">User</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn-secondary" onclick="closeUserModal()">Cancel</button>
                <button class="submit-btn btn-sm" onclick="saveUser()">Create User</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>

</html>
