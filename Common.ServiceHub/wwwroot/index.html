<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommonHub - Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-wrapper">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>

        <div class="login-card-container">
            <div class="glass-card">
                <div class="brand-header">
                    <div class="brand-icon-wrapper">
                        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                        </svg>
                    </div>
                    <h1 class="brand-title">CommonHub</h1>
                    <p class="brand-subtitle">General Service & Inventory Management</p>
                </div>

                <form id="loginForm" class="login-form" autocomplete="off">
                    <div class="input-group">
                        <label class="input-label" for="username">Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input type="text" id="username" class="form-input" placeholder="Enter username" autocomplete="off" value="" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input type="password" id="password" class="form-input" placeholder="Enter password" autocomplete="new-password" value="" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePassword()">👁️</button>
                        </div>
                    </div>

                    <div id="errorMsg" class="alert-box alert-error hidden"></div>

                    <button type="submit" id="submitBtn" class="submit-btn">
                        <span>Sign In</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>

</html>
