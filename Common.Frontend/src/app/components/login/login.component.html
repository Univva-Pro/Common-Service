<div class="login-wrapper">
  <!-- Background Animated Glowing Orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <!-- Main Login Card -->
  <div class="login-card-container">
    <div class="glass-card login-card">
      
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-icon-wrapper">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="brand-title">CommonHub</h1>
        <p class="brand-subtitle">Common Service Inventory & Operations Gateway</p>
      </div>

      <!-- Mode Toggle Switch -->
      <div style="display: flex; gap: 10px; margin-bottom: 1.25rem; background: rgba(255, 255, 255, 0.05); padding: 4px; border-radius: 8px;">
        <button type="button" (click)="isRegistering = false; errorMsg = ''" [style.background]="!isRegistering ? 'rgba(255, 255, 255, 0.15)' : 'transparent'" style="flex: 1; border: none; padding: 8px; color: white; font-weight: 600; border-radius: 6px; cursor: pointer;">Sign In</button>
        <button type="button" (click)="isRegistering = true; errorMsg = ''" [style.background]="isRegistering ? 'rgba(255, 255, 255, 0.15)' : 'transparent'" style="flex: 1; border: none; padding: 8px; color: white; font-weight: 600; border-radius: 6px; cursor: pointer;">Register</button>
      </div>

      <!-- Login Form -->
      <form *ngIf="!isRegistering" (ngSubmit)="login()" class="login-form" autocomplete="off">
        
        <!-- Username Input Field -->
        <div class="input-group">
          <label for="username" class="input-label">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input 
              id="username"
              type="text" 
              [(ngModel)]="credentials.username" 
              name="username" 
              placeholder="Enter username" 
              autocomplete="off"
              required
              class="form-input"
            />
          </div>
        </div>

        <!-- Password Input Field -->
        <div class="input-group">
          <label for="password" class="input-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              id="password"
              [type]="showPassword ? 'text' : 'password'" 
              [(ngModel)]="credentials.password" 
              name="password" 
              placeholder="Enter password" 
              autocomplete="new-password"
              required
              class="form-input"
            />
            <button 
              type="button" 
              class="password-toggle-btn"
              (click)="togglePasswordVisibility()" 
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error Alert -->
        <div *ngIf="errorMsg" class="alert-box alert-error">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>{{ errorMsg }}</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading" class="btn-text">
            Sign In to Dashboard
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
          <span *ngIf="isLoading" class="btn-spinner-container">
            <span class="spinner"></span>
            Authenticating...
          </span>
        </button>
      </form>

      <!-- Registration Form (Saves to MongoDB) -->
      <form *ngIf="isRegistering" (ngSubmit)="register()" class="login-form" autocomplete="off">
        
        <!-- Username Field -->
        <div class="input-group">
          <label for="reg-username" class="input-label">Username</label>
          <div class="input-wrapper">
            <input 
              id="reg-username"
              type="text" 
              [(ngModel)]="registerData.username" 
              name="regUsername" 
              placeholder="Choose a username" 
              required
              class="form-input"
            />
          </div>
        </div>

        <!-- Email Field -->
        <div class="input-group">
          <label for="reg-email" class="input-label">Email</label>
          <div class="input-wrapper">
            <input 
              id="reg-email"
              type="email" 
              [(ngModel)]="registerData.email" 
              name="regEmail" 
              placeholder="user@example.com" 
              class="form-input"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="input-group">
          <label for="reg-password" class="input-label">Password</label>
          <div class="input-wrapper">
            <input 
              id="reg-password"
              type="password" 
              [(ngModel)]="registerData.password" 
              name="regPassword" 
              placeholder="Create password" 
              required
              class="form-input"
            />
          </div>
        </div>

        <!-- Role Selection -->
        <div class="input-group">
          <label for="reg-role" class="input-label">Account Role</label>
          <div class="input-wrapper">
            <select id="reg-role" [(ngModel)]="registerData.role" name="regRole" class="form-input" style="background: rgba(15, 23, 42, 0.8); color: white;">
              <option value="User">User</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
        </div>

        <!-- Error Alert -->
        <div *ngIf="errorMsg" class="alert-box alert-error">
          <span>{{ errorMsg }}</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading" class="btn-text">
            Create MongoDB Account
          </span>
          <span *ngIf="isLoading" class="btn-spinner-container">
            <span class="spinner"></span>
            Registering...
          </span>
        </button>
      </form>

      <!-- Footer Info -->
      <div class="card-footer">
        <p>Protected by <span>MongoDB Atlas & JWT Bearer Security</span> • Common-Service v1.0</p>
      </div>

    </div>
  </div>
</div>
